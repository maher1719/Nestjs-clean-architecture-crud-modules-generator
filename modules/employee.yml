module: employees

entity:
  name: Employees
  table: employees

  fields:
    - name: organizationId
      type: uuid

    - name: firstName
      type: string

    - name: lastName
      type: string

    - name: email
      type: string
relations:
  - name: organization
    type: many-to-one
    target: Organization
    targetModule: organizations
    foreignKey: organizationId
    nullable: false
    onDelete: restrict

operations:
  - create
  - list
  - get
  - update
  - delete
