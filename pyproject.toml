[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nestjs-clean-gen"
version = "1.0.0"
authors = [
  { name="Maher Ben Abdessalem", email="ba.maher94@gmail.com" },
]
description = "Generate production-grade NestJS Clean Architecture & DDD modules from YAML."
readme = "README.md"
license = { file = "LICENCE" }
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
]

keywords = [
    "Nestjs", "code generator", "Clean Architecture", "JavaScript", "js",
    "Nestjs clean architecture","DDD","backend"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Code Generators",
    "Programming Language :: JavaScript",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Environment :: Console",
    "Operating System :: OS Independent",
]

[project.scripts]
nest-clean-gen = "generator.structure.cli:main"



[tool.setuptools.packages.find]
include = ["generator*"]